<title>Range Rider — Flipbook</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  :root {
    --paper: #f2ede3;
    --ink: #1a1a1a;
    --accent: #c1440e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: #0d0d0d;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: var(--ink);
    padding: 30px 16px;
  }
  h1 {
    color: var(--paper);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.5px;
    margin: 0;
    text-align: center;
  }
  #book {
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }
  .page {
    background-color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: white;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .controls button {
    background: var(--paper);
    border: none;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    border-radius: 3px;
  }
  .controls button:hover {
    background: var(--accent);
    color: var(--paper);
  }
  #pageIndicator {
    color: var(--paper);
    font-size: 13px;
    min-width: 70px;
    text-align: center;
  }
</style>
</head>

<div class="controls">
  <button id="prev">‹ Prev</button>
  <span id="pageIndicator">1 / 72</span>
  <button id="next">Next ›</button>
</div>

<script>
  const pageFlip = new St.PageFlip(document.getElementById('book'), {
    width: 400,
    height: 518,
    size: 'stretch',
    minWidth: 260,
    maxWidth: 600,
    minHeight: 337,
    maxHeight: 780,
    maxShadowOpacity: 0.5,
    showCover: true,
    mobileScrollSupport: true
  });

  pageFlip.loadFromHTML(document.querySelectorAll('.page'));

  const indicator = document.getElementById('pageIndicator');
  const totalPages = 72;

  pageFlip.on('flip', (e) => {
    indicator.textContent = (e.data + 1) + ' / ' + totalPages;
  });

  document.getElementById('prev').addEventListener('click', () => pageFlip.flipPrev());
  document.getElementById('next').addEventListener('click', () => pageFlip.flipNext());
</script>
